experiment:
  name: cifar100_resnet20_baseline_seed42

seed: 42
device: auto

data:
  dataset: cifar100
  root: data
  download: true
  batch_size: 128
  num_workers: 2

model:
  name: resnet20
  num_classes: 100

train:
  epochs: 200
  log_interval: 50
  eval_interval: 1

optimizer:
  name: sgd
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0005

scheduler:
  name: cosine
  eta_min: 0.0

output:
  runs_dir: runs
  checkpoint_dir: checkpoints
